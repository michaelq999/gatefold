<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<meta name="color-scheme" content="light">
<meta name="description" content="A personal, ad-free player for independent music from Jamendo.">
<title>Gatefold</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23566233'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23F6F1E7' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23F6F1E7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to content</a>

<header class="masthead">
  <div class="masthead__in">
    <a class="wordmark" href="#listen">Gatefold</a>
    <nav class="nav" aria-label="Areas">
      <a href="#listen" data-nav="listen">Listen</a>
      <a href="#search" data-nav="search">Search</a>
      <a href="#library" data-nav="library">Library</a>
    </nav>
    <div class="masthead__end">
      <button class="iconbtn" type="button" id="open-settings" aria-label="Settings" title="Settings" data-icon="settings"></button>
    </div>
  </div>
</header>

<div class="banner" id="banner" hidden></div>

<main class="main" id="main" tabindex="-1">
  <div id="view"></div>
</main>

<section class="player" id="player" aria-label="Player"></section>
<section class="sheet" id="sheet" aria-label="Now playing" aria-hidden="true"></section>

<nav class="tabs" id="tabs" aria-label="Areas">
  <a href="#listen" data-nav="listen" data-icon="listen">Listen</a>
  <a href="#search" data-nav="search" data-icon="search">Search</a>
  <a href="#library" data-nav="library" data-icon="library">Library</a>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="layer"></div>

<noscript><p style="padding:24px;font-family:sans-serif">Gatefold needs JavaScript turned on to play music.</p></noscript>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/catalog.js"></script>
<script src="js/playlists.js"></script>
<script src="js/taste.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/playerbar.js"></script>
<script src="js/settings.js"></script>
<script src="js/view-listen.js"></script>
<script src="js/view-search.js"></script>
<script src="js/view-library.js"></script>
<script src="js/app.js"></script>
</body>
</html>
